<div class="container mt-4" style="max-width: 600px; margin: auto; padding: 20px;">
    <h2>My Tasks</h2>

    <div class="input-group mb-4" style="margin-bottom: 20px; display: flex; gap: 10px;">
        <input type="text" [(ngModel)]="newTaskTitle" class="form-control" placeholder="Add a task..."
            style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        <button (click)="addTask()" class="btn btn-primary"
            style="background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Add
            Task</button>
    </div>

    <div class="task-list">
        @for (currentTask of tasks; track currentTask.id) {
        <app-task-card [task]="currentTask" (deleteRequest)="removeTask($event)">
        </app-task-card>
        } @empty {
        <p style="color: #666; font-style: italic;">No tasks left!</p>
        }
    </div>
</div>
