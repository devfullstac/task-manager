<div class="card mb-2 shadow-sm"
    style="padding: 10px; border: 1px solid #eee; margin-bottom: 10px; border-radius: 4px; background: #fff; display: flex; justify-content: space-between; align-items: center; flex-direction: row;">
    <h5 class="mb-0" style="margin: 0;">{{ task.title }}</h5>
    <button (click)="onDelete()"
        style="background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Delete</button>
</div>
